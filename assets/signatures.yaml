# Signatures d'appareils d'Arpent : chaque signature ajoute « weight » points
# au type indiqué quand TOUTES ses conditions sont vraies. Le type qui
# totalise le plus de points (au moins 3) est retenu ; « product » donne un
# libellé lisible (premier trouvé parmi les signatures du type retenu).
#
# Conditions (expressions régulières insensibles à la casse) :
#   vendor      fabricant (base OUI)          name      noms (DNS, NetBIOS, mDNS)
#   http_title  titre d'une page web           http_server  en-tête Server / X-Powered-By
#   ssdp        description UPnP (type, fabricant, modèle, serveur)
#   mdns        types de services mDNS        snmp      sysDescr
#   banner      bannière d'un service         product_re  produit identifié (ex. OpenSSH)
#   ports       ports tous ouverts (« 9100/tcp ») ; any_ports : au moins un
#   netbios     true : répond en NetBIOS       random_mac true : MAC aléatoire

# --- Imprimantes
- { type: printer, weight: 5, ports: ["9100/tcp"] }
- { type: printer, weight: 3, any_ports: ["515/tcp", "631/tcp"] }
- { type: printer, weight: 4, mdns: "_ipp\\.|_pdl-datastream|_printer\\." }
- { type: printer, weight: 3, vendor: "brother|lexmark|kyocera|ricoh|xerox|canon|epson|konica|oki electric|zebra" }
- { type: printer, weight: 2, vendor: "hewlett|hp inc" }
- { type: printer, weight: 4, http_title: "printer|imprimante|laserjet|officejet|deskjet|easyinfo|web image monitor|command ?center|syncthru|embedded web server" }
- { type: printer, weight: 4, snmp: "printer|laserjet|jetdirect|kyocera|ricoh|brother nc" }
- { type: printer, weight: 4, ssdp: "printer" }

