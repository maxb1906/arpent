name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: make fmt-check
      - run: go vet ./...
      - run: go test -race ./...
      - name: PDF et formulaires dans un vrai navigateur (runner)
        run: go test -run 'TestPDF|TestRealBrowser' -v ./internal/report/ ./internal/web/
        env:
          ARPENT_REQUIRE_BROWSER: "1"

  build:
    name: Build (cross-compilation)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-all
      - name: SHA-256
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: arpent-binaries
          path: dist/
          if-no-files-found: error
      - name: Vérification de la configuration GoReleaser (à blanc)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "v2.20.1"
          args: release --snapshot --clean --skip=publish

  smoke-windows:
    name: Lancement de l'exe Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arpent-binaries
          path: dist
      - name: Run arpent.exe
        shell: pwsh
        run: |
          ./dist/arpent-windows-amd64.exe --lang fr hello
          ./dist/arpent-windows-amd64.exe --lang en hello
          ./dist/arpent-windows-amd64.exe hello
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe interfaces
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe arp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe discover --range 127.0.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe ports --range 127.0.0.1 --profile quick --no-discover
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe scan --range 127.0.0.1 --profile quick --no-discover
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe --data "$env:RUNNER_TEMP\arpent-data" scan --site "CI Windows" --authorized --range 127.0.0.1 --profile quick --no-discover
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe --data "$env:RUNNER_TEMP\arpent-data" show --site "CI Windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe --data "$env:RUNNER_TEMP\arpent-data" report --site "CI Windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Interface web (démarrage et page d'accueil)
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\arpent-ui"
          $p = Start-Process -FilePath ./dist/arpent-windows-amd64.exe -ArgumentList "--data","$data","ui","--no-browser","--port","47123" -PassThru -RedirectStandardOutput ui.log -NoNewWindow
          Start-Sleep -Seconds 3
          $url = (Select-String -Path ui.log -Pattern 'http://127\.0\.0\.1:47123/login\?k=\S+').Matches[0].Value
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $r = Invoke-WebRequest -Uri $url -WebSession $s -UseBasicParsing
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch 'Arpent') { Stop-Process $p; exit 1 }
          Stop-Process $p
