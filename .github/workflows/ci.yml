name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: make fmt-check
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: Build (cross-compilation)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-all
      - name: SHA-256
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: arpent-binaries
          path: dist/
          if-no-files-found: error

  smoke-windows:
    name: Lancement de l'exe Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arpent-binaries
          path: dist
      - name: Run arpent.exe
        shell: pwsh
        run: |
          ./dist/arpent-windows-amd64.exe --lang fr
          ./dist/arpent-windows-amd64.exe --lang en
          ./dist/arpent-windows-amd64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe interfaces
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe arp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe discover --range 127.0.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/arpent-windows-amd64.exe ports --range 127.0.0.1 --profile quick --no-discover
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
